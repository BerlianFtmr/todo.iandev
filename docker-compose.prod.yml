# ============================================================
# docker-compose PRODUCTION - todo.iandev
# Stack: Express.js + EJS (app) + MySQL 8 (db)
# Reverse proxy / SSL / jaringan publik ditangani Cloudflare Tunnel.
# Port app hanya di-bind ke localhost host, tidak expose ke publik.
#
# Jalankan: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: todo_iandev_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    command: --default-time-zone=+07:00
    volumes:
      # Named volume agar data persist terkelola docker
      - mysql_data:/var/lib/mysql
      # Init schema hanya jalan saat volume kosong (pertama kali)
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - todo_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Tidak ada port ke host: hanya diakses internal oleh app
    expose:
      - "3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo.iandev:latest
    container_name: todo_iandev_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      TZ: Asia/Jakarta
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      APP_TIMEZONE: ${APP_TIMEZONE:-+07:00}
    # Bind ke localhost host saja; Cloudflare Tunnel yang meneruskan trafik
    ports:
      - "${APP_HOST_PORT:-127.0.0.1:5000}:5000"
    networks:
      - todo_net

networks:
  todo_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
