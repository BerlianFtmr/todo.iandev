services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=tododb
      - MYSQL_USER=myuser
      - MYSQL_PASSWORD=123456
      - TZ=Asia/Jakarta
    command: --default-time-zone=+07:00
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      # Init schema hanya jalan saat volume kosong (pertama kali)
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # PENTING: MySQL entrypoint HANYA menjalankan file *.sql yang berada
      # LANGSUNG di /docker-entrypoint-initdb.d/ (tidak menelusuri sub-folder).
      # Tiap file migration di-mount satu per satu ke level atas dengan prefix
      # angka agar urut. Semua migration idempotent, aman untuk volume baru.
      - "./migrations/2026-09-14 - add color column to folders.sql:/docker-entrypoint-initdb.d/02-migration-color.sql"
      - "./migrations/2026-09-14 - add parent_id column to folders.sql:/docker-entrypoint-initdb.d/03-migration-parent_id.sql"